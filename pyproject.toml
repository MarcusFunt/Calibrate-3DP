[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrate-3dp"
version = "0.1.0"
description = "Local-first, semi-automatic calibration workbench for FDM printers"
requires-python = ">=3.11"

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
calibrate3dp = "calibrate3dp.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
