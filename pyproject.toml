[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrate-3dp"
version = "0.1.0"
description = "Local-first, semi-automatic calibration workbench for FDM printers"
requires-python = ">=3.11"

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
cad = ["build123d==0.13.0", "cadquery-ocp-novtk==8.0.1.1.0"]

[project.scripts]
calibrate3dp = "calibrate3dp.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calibrate3dp = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]
